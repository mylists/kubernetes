fullnameOverride: mtvl-docs

replicaCount: 1

image:
  repository: mylists/docs
  tag: "latest"

containerPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  provider: "{{ ingress.provider }}"
  className: nginx
  hosts:
    - host: "docs.{{ args.domain }}"
      paths:
        - path: /
          pathType: Prefix
  tls: []
  redirectToHTTPS: true

gateway:
  parentRefs: {{ get_var("gateway.parentRefs", []) }}

certificate:
  enabled: "{{ certificate.enabled }}"
  issuerRef: {{ certificate.issuerRef }}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
