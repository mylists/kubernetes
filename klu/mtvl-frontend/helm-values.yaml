fullnameOverride: mtvl-frontend

replicaCount: 2

image:
  repository: mylists/mtvl-frontend
  tag: "latest"

env:
  VITE_API_BASE_URL: {{ frontend.api_url }}

containerPort: 80

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  provider: "{{ ingress.provider }}"
  className: nginx
  hosts:
    - host: "{{ args.domain }}"
      paths:
        - path: /
          pathType: Prefix
  tls: []
  redirectToHTTPS: true

gateway:
  parentRefs: {{ get_var("gateway.parentRefs", []) }}

certificate:
  enabled: "{{ certificate.enabled }}"
  issuerRef: {{ certificate.issuerRef }}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
