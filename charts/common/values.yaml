replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

containerPort: 80

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  # nginx | traefik | gateway
  provider: nginx
  className: ""
  annotations: {}
  hosts: []
  tls: []
  # Redirect HTTP to HTTPS for nginx, Traefik, and Gateway
  redirectToHTTPS: false

traefik:
  apiVersion: traefik.io/v1alpha1
  annotations: {}
  entryPoints:
    - websecure
  middlewares: []
  redirectToHTTPS: false
  tls: {}

# Kubernetes Gateway API. Used when ingress.provider is gateway.
# HTTPRoutes are built from ingress.hosts. Attach them to an existing
# Gateway via parentRefs, or set create: true to render a Gateway here.
gateway:
  apiVersion: gateway.networking.k8s.io/v1
  annotations: {}
  # Required unless create is true.
  parentRefs: []
  # HTTP -> HTTPS redirect HTTPRoute (attaches to the HTTP listener)
  redirectToHTTPS: false
  # Parent refs for the redirect route. Defaults to parentRefs with
  # sectionName: http, or the created Gateway's http listener.
  httpParentRefs: []
  # Create a Gateway in this release
  create: false
  name: ""
  gatewayClassName: ""
  gatewayAnnotations: {}
  # If empty and create is true, listeners are generated (http / https)
  listeners: []
  tls:
    secretName: ""
    mode: Terminate

# Optional cert-manager Certificate. When enabled, the issued secret is
# wired into Ingress / IngressRoute / Gateway unless those already set a secretName.
certificate:
  enabled: false
  name: ""
  secretName: ""
  annotations: {}
  issuerRef:
    name: ""
    kind: ClusterIssuer
  # Defaults to hosts from ingress.hosts
  dnsNames: []
  commonName: ""
  duration: ""
  renewBefore: ""
  usages: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Key/value environment variables
env: {}

# Extra env entries (supports valueFrom)
extraEnv: []

# envFrom secret/configmap refs
envFrom: []

configMap:
  enabled: false
  data: {}

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30
